<script>
const MAIN=18;
const S=[{"t":"O PAPEL DO ADMINISTRADOR NA IMPLEMENTAÇÃO DE POLÍTICAS PÚBLICAS","sub":"Da decisão pública à capacidade de entrega","html":"<div class=\"hero\"><div class=\"kicker\">IV Congresso Científico · Anhanguera Asa Norte</div><h2>O papel do administrador na implementação de políticas públicas</h2><p class=\"lead\">Da decisão pública à capacidade de entrega</p><div class=\"meta\">Igor Caires Machado · Analista Judiciário (CNJ) · Pós-doutorado (ENAP)</div><div class=\"meta\">07 de outubro de 2026 · Curso de Administração · Brasília – DF</div></div>","notes":"Abertura: o que acontece entre uma decisão e o resultado que chega ao cidadão? Apresentar a implementação como problema de Administração."},{"t":"O QUE É UMA POLÍTICA PÚBLICA?","html":"<h2>O que é uma política pública?</h2><div class=\"quote\">Política pública é um conjunto articulado de decisões, diretrizes e ações voltadas ao enfrentamento de um problema público, sob responsabilidade ou coordenação do poder público.</div><div class=\"example-title\">Exemplo ilustrativo: ampliar o acesso à educação infantil</div><div class=\"grid3\"><div class=\"card\"><b>Problema público</b><span>Famílias sem acesso a creches.</span></div><div class=\"card\"><b>Resposta organizada</b><span>Vagas, equipes e regras de acesso.</span></div><div class=\"card\"><b>Resultado esperado</b><span>Crianças com atendimento.</span></div></div><div class=\"refs\">Secchi (2013/2014); Rua (2014); TCU (2020), Referencial de Controle de Políticas Públicas.</div>","notes":"Começar perguntando que problema da vida dos estudantes depende de uma resposta coletiva. Guardar o exemplo da creche para mostrar que decisão não garante entrega."},{"t":"TRAJETÓRIA: PROJETO, GESTÃO E PESQUISA","html":"<h2>Trajetória: projeto, gestão e pesquisa</h2><div class=\"grid3 journey\"><div class=\"card\"><b>Espaço</b><span>Arquitetura e Urbanismo<br>UFBA</span></div><div class=\"card\"><b>Gestão</b><span>TJBA, CNJ e ENAJU</span></div><div class=\"card\"><b>Pesquisa</b><span>Doutorado na UCES<br>Pós-doutorado na ENAP</span></div></div><div class=\"statement\">A pesquisa começou como uma forma de entender por que decisões nem sempre viram resultados na gestão.</div>","notes":"Minha trajetória começou com espaço, passou pela gestão e chegou à pesquisa. A pesquisa aparece como ferramenta para investigar problemas reais."},{"t":"DA POLÍTICA PÚBLICA À ORGANIZAÇÃO","html":"<h2>Da política pública à organização</h2><div class=\"quote\">Uma política pública organiza objetivos, instrumentos e responsabilidades para enfrentar um problema público.</div><div class=\"parallel\"><div><div class=\"label\">NAS ORGANIZAÇÕES</div><div class=\"flow\">Objetivo estratégico <i>›</i> projeto <i>›</i> equipe <i>›</i> recursos <i>›</i> execução <i>›</i> entrega</div></div><div><div class=\"label\">NAS POLÍTICAS PÚBLICAS</div><div class=\"flow\">Problema público <i>›</i> política <i>›</i> organizações <i>›</i> equipes <i>›</i> implementação <i>›</i> resultado público</div></div></div><div class=\"statement\">Objetivos precisam ser convertidos em ação organizada.</div><div class=\"refs\">Pressman & Wildavsky (1973); Hill & Hupe (2022); Secchi; TCU (2020).</div>","notes":"Fazer o paralelo com a empresa: uma decisão estratégica não produz entrega sem projeto, equipe, orçamento, processos e acompanhamento."},{"t":"ONDE ENTRA O ADMINISTRADOR?","html":"<h2>Onde entra o administrador?</h2><div class=\"admin-stack\"><div class=\"pill\">POLÍTICA PÚBLICA</div><div class=\"arrow\">↓</div><div class=\"admin\">ADMINISTRADOR <small>intermediação</small></div><div class=\"verbs\"><span>formular</span><span>traduzir</span><span>coordenar</span><span>executar</span><span>monitorar</span><span>aprender</span></div><div class=\"arrow\">↓</div><div class=\"pill\">ORGANIZAÇÃO</div><div class=\"resources\">equipes · processos · recursos · tecnologia · contratos · informação</div><div class=\"arrow\">↓</div><div class=\"pill\">SERVIÇOS E RESULTADOS</div></div><div class=\"statement\">Intermediário: ator que conecta partes da implementação.</div><div class=\"refs\">Lipsky (1980); Abbott, Levi-Faur & Snidal (2017); Hill & Hupe (2022).</div>","notes":"O administrador pode formular, traduzir, coordenar, executar, monitorar e aprender. Introduzir intermediário como função exercida na relação."},{"t":"O ADMINISTRADOR COMO INTERMEDIÁRIO","html":"<h2>O administrador como intermediário</h2><div class=\"quote\">Na governança regulatória, o intermediário é definido pela função que exerce na relação.</div><div class=\"compare\"><div class=\"card\"><b>GOVERNANÇA REGULATÓRIA</b><div class=\"flow big\">REGULADOR <i>→</i> <strong>INTERMEDIÁRIO</strong> <i>→</i> DESTINATÁRIO</div></div><div class=\"card\"><b>ADMINISTRAÇÃO PÚBLICA</b><div class=\"flow big\">POLÍTICA PÚBLICA <i>→</i> <strong>ADMINISTRADOR</strong> <i>→</i> ORGANIZAÇÃO E CIDADÃO</div></div></div><div class=\"statement\">A função é conectar objetivos, capacidades e ação organizada.</div><div class=\"chips\"><span>traduzir</span><span>coordenar</span><span>informar</span><span>monitorar</span><span>construir capacidades</span></div><div class=\"research-line\">Evolução da pesquisa: arquitetura judiciária → implementação → governança regulatória → ARENAS</div><div class=\"refs\">Abbott, Levi-Faur & Snidal (2017); Levi-Faur (2011); Hill & Hupe (2022).</div>","notes":"Explicar que esse paralelo nasce da evolução da minha própria agenda científica: da arquitetura judiciária à implementação, depois à governança regulatória e ao ARENAS."},{"t":"DADOS COMO DIFERENCIAL DO ADMINISTRADOR","html":"<h2>Dados como diferencial do administrador</h2><div class=\"quote\">O diferencial hoje é transformar dados brutos em informação para decidir melhor.</div><div class=\"dataflow\"><div class=\"stage\"><b>DADOS BRUTOS</b><span>planilhas · sistemas<br>atendimentos · prazos</span></div><div class=\"arrowx\">→</div><div class=\"stage accent\"><b>MÉTODO CIENTÍFICO + IA</b><span>pergunta · hipótese<br>variável · análise</span></div><div class=\"arrowx\">→</div><div class=\"stage\"><b>DECISÃO FUNDAMENTADA</b><span>diagnóstico · proposta<br>indicador · aprendizagem</span></div></div><div class=\"statement\">Organizações já produzem dados. Método transforma registros dispersos em evidência para ação.</div><div class=\"warning\">Com método, a inteligência artificial acelera a análise.<br>Sem método, ela só acelera a confusão.</div><div class=\"chips\"><span>observar</span><span>medir</span><span>analisar</span><span>comunicar</span><span>decidir</span></div><div class=\"refs\">Simon (1947); Briner, Denyer & Rousseau (2009).</div>","notes":"Conectar com empresas e carreira. Hoje é muito mais fácil analisar bases com IA, mas metodologia é o que permite formular perguntas, testar hipóteses e transformar dados brutos em informação útil."},{"t":"ONDE A IMPLEMENTAÇÃO REALMENTE ACONTECE","html":"<h2>Onde a implementação realmente acontece</h2><div class=\"quote\">A política chega à organização. Mas é em situações concretas que ela se realiza.</div><div class=\"cloud\"><span>balcão</span><span>plataforma</span><span>formulário</span><span>sala</span><span>sistema</span><span>fila</span><span>equipe</span><span>contrato</span><span>documento</span><span>infraestrutura</span><span>atendimento</span><span>recursos</span></div><div class=\"equation\">pessoas + regras + tecnologias + documentos + recursos + espaços</div><div class=\"question\">O que acontece quando esses elementos se encontram?</div><div class=\"refs\">Lipsky (1980); Lascoumes & Le Galès (2007); Bitner (1992); Herd & Moynihan (2019).</div>","notes":"A implementação não acontece abstratamente dentro de um organograma. Ela acontece quando pessoas, regras, tecnologias, documentos, recursos e espaços se encontram."},{"t":"PARA INVESTIGAR, É PRECISO DE TEORIA","html":"<h2>Para investigar, é preciso de teoria</h2><div class=\"grid3\"><div class=\"card\"><b>Enxergar variáveis</b><span>que o senso comum não vê</span></div><div class=\"card\"><b>Formular</b><span>boas perguntas</span></div><div class=\"card\"><b>Interpretar</b><span>as evidências</span></div></div><div class=\"statement\">Foi assim que surgiu o Método ARENAS.</div><div class=\"flow center\">Problema prático <i>›</i> Teoria <i>›</i> Pesquisa <i>›</i> Método</div>","notes":"A teoria tem função prática: ajuda a saber o que observar, que variáveis procurar e como interpretar evidências."},{"t":"CIDADÃO – BENEFÍCIO","html":"<h2>Cidadão – benefício</h2><div class=\"quote\">Aplicativo, documento, fila, conversa com um servidor, decisão. Eu chamo esse conjunto de arena de implementação.</div><div class=\"statement\">Arena = pessoas + regras + espaços + tecnologias + práticas</div><div class=\"grid5\"><div class=\"card\"><b>Quem participa?</b></div><div class=\"card\"><b>Que regras orientam?</b></div><div class=\"card\"><b>Que espaços e artefatos existem?</b></div><div class=\"card\"><b>Que tecnologias são usadas?</b></div><div class=\"card\"><b>O que as pessoas realmente fazem?</b></div></div><div class=\"refs\">Orlikowski (2007); Leonardi (2011).</div>","notes":"Percorrer a experiência do cidadão e só depois apresentar a definição curta de arena."},{"t":"UM PROTOCOLO SIMPLES PARA INVESTIGAR A IMPLEMENTAÇÃO","html":"<h2>Um protocolo simples para investigar a implementação</h2><div class=\"arenas\"><div><b>A</b><span>Arranjo espacial</span></div><div><b>R</b><span>Rotinas de trabalho</span></div><div><b>E</b><span>Experiência</span></div><div><b>N</b><span>Navegabilidade</span></div><div><b>A</b><span>Aprendizagem</span></div><div><b>S</b><span>Sociomaterialidade</span></div></div><div class=\"steps\"><span>1 Observar</span><span>2 Diagnosticar</span><span>3 Redesenhar</span><span>4 Testar</span><span>5 Avaliar</span><span>6 Aprender</span></div><div class=\"refs\">Protocolo em desenvolvimento. As proposições e os instrumentos requerem teste empírico.</div>","notes":"Explicar o ARENAS como formulação fundamentada em desenvolvimento e validação."},{"t":"O ÓRGÃO REDESENHOU O ATENDIMENTO. A FILA CONTINUA.","html":"<h2>O órgão redesenhou o atendimento. A fila continua.</h2><div class=\"quote\">Caso ilustrativo: três meses após a mudança, a fila continua. Qual é a primeira hipótese de vocês?</div><div class=\"grid3\"><div class=\"card\"><b>Espaço</b><span>A distribuição mudou?</span></div><div class=\"card\"><b>Rotina real</b><span>O trabalho mudou?</span></div><div class=\"card\"><b>Sistema</b><span>A tecnologia mudou?</span></div><div class=\"card\"><b>Usuários</b><span>Compreenderam?</span></div><div class=\"card\"><b>Equipes</b><span>Compreenderam?</span></div><div class=\"card\"><b>Erros</b><span>Há registro e retorno?</span></div></div><div class=\"statement\">Primeiro, hipóteses. Depois, evidências.</div><div class=\"question\">Onde há fricção e quem pode corrigi-la?</div><div class=\"refs\">Briner, Denyer & Rousseau (2009).</div>","notes":"Recolher hipóteses antes de apresentar respostas. Pedir à turma uma fonte de dados para testar cada hipótese."},{"t":"COMO TRANSFORMAR UM PROBLEMA DE GESTÃO EM PESQUISA?","html":"<h2>Como transformar um problema de gestão em pesquisa?</h2><div class=\"researchflow\"><div><b>Problema</b><span>A fila continua.</span></div><div><b>Pergunta</b><span>Onde o atendimento trava?</span></div><div><b>Hipótese</b><span>Há retrabalho no cadastro.</span></div><div><b>Dados</b><span>Tempos, retornos e observação.</span></div><div><b>Análise</b><span>Comparar etapas e unidades.</span></div><div><b>Decisão</b><span>Testar uma mudança e avaliar.</span></div></div><div class=\"statement\">Do sintoma à decisão fundamentada.</div><div class=\"refs\">Exemplo ilustrativo. A hipótese ainda precisa de teste. Briner, Denyer & Rousseau (2009).</div>","notes":"Percorrer problema, pergunta, hipótese, dados, análise e decisão. Considerar hipóteses rivais."},{"t":"EXEMPLO DE PERGUNTA DE PESQUISA","html":"<h2>Exemplo de pergunta de pesquisa</h2><div class=\"question huge\">Quando serviços simples migram para o digital, o atendimento presencial fica mais complexo?</div><div class=\"card wide\"><b>Como testar?</b><span>Comparar antes e depois e comparar unidades.<br>Medir o perfil dos atendimentos.<br>Observar a demanda de espaço e de equipe.</span></div><div class=\"refs\">Pergunta de pesquisa, não resultado confirmado. Christensen et al. (2020), conforme apresentação original.</div>","notes":"Tratar como pergunta e hipótese, não como achado. Antes/depois isoladamente não demonstra causalidade."},{"t":"UMA BOA PESQUISA SABE O QUE AINDA NÃO SABE","html":"<h2>Uma boa pesquisa sabe o que ainda não sabe</h2><div class=\"grid3\"><div class=\"card\"><b>Hipótese</b><span>Uma explicação a testar.</span></div><div class=\"card\"><b>Evidência</b><span>O que os dados permitem observar.</span></div><div class=\"card\"><b>Conclusão</b><span>O que a análise sustenta, com limites.</span></div></div><div class=\"warning\">Nunca apresente uma hipótese como se fosse resultado.</div><div class=\"statement\">ARENAS: formulação teórica fundamentada. Teste empírico e validação dos instrumentos em desenvolvimento.</div>","notes":"Preservar a distinção entre proposição, evidência e conclusão."},{"t":"SEU LOCAL DE TRABALHO É UM CAMPO DE PESQUISA","html":"<h2>Seu local de trabalho é um campo de pesquisa</h2><div class=\"steps five\"><span><b>1</b> Observe<br><small>Que problema se repete?</small></span><span><b>2</b> Registre<br><small>Casos, fluxos e erros.</small></span><span><b>3</b> Meça<br><small>Use dados disponíveis.</small></span><span><b>4</b> Teste<br><small>Avalie uma mudança.</small></span><span><b>5</b> Comunique<br><small>O resultado e seus limites.</small></span></div><div class=\"statement\">Empresa, hospital, escola, órgão público, tribunal, banco ou plataforma digital: todos podem ser campos de pesquisa.</div><div class=\"chips\"><span>artigo</span><span>relatório</span><span>dashboard</span><span>proposta de melhoria</span></div>","notes":"Pesquisa como competência profissional. Usar apenas dados autorizados e respeitar privacidade."},{"t":"E DAQUI PARA ONDE?","html":"<h2>E daqui para onde?</h2><div class=\"quote\">A graduação pode ser o início de uma trajetória de investigação, e não o fim do estudo.</div><div class=\"flow center long\">Graduação <i>›</i> curiosidade <i>›</i> iniciação científica <i>›</i> pesquisa <i>›</i> pós-graduação <i>›</i> produção de conhecimento <i>›</i> transformação</div><div class=\"grid3\"><div class=\"card\"><b>Que problemas da Administração</b><span>ainda precisam ser compreendidos?</span></div><div class=\"card\"><b>Que situações do seu trabalho</b><span>podem virar perguntas de pesquisa?</span></div><div class=\"card\"><b>Que conhecimento você pode produzir</b><span>a partir da realidade que conhece?</span></div></div><div class=\"statement\">Um problema recorrente pode virar projeto, análise de dados, relatório, artigo ou proposta de melhoria.</div>","notes":"Abrir horizonte para iniciação científica, pesquisa aplicada, pós-graduação e produção de conhecimento."},{"t":"CONTINUE PERGUNTANDO.","html":"<div class=\"hero end\"><h2>Continue perguntando.</h2><p class=\"lead\">Continue estudando.<br>Continue investigando.</p><div class=\"statement\">Administração também é produção de conhecimento.</div><div class=\"meta\">Igor Caires Machado · cairesmachado-svg.github.io/Site_hub</div><div class=\"meta\">IV Congresso Científico · Anhanguera Asa Norte · 2026</div><a class=\"site\" href=\"https://cairesmachado-svg.github.io/Site_hub/\" target=\"_blank\" rel=\"noopener\">Materiais, referências e contato</a><div class=\"thanks\">Obrigado.</div></div>","notes":"Encerramento. Retomar a ideia central: continuem perguntando, estudando e investigando."},{"t":"DECISÃO – EXECUÇÃO – RESULTADO","html":"<h2>DECISÃO – EXECUÇÃO – RESULTADO</h2><div class=\"supportbox\">Pressman e Wildavsky (1973): decidir não garante executar.<br><br>Lipsky (1980): a linha de frente produz a política.<br><br>Hill e Hupe (2022): o contexto condiciona a execução.<br><br><b>É nesse intervalo que o administrador trabalha.</b></div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."},{"t":"A LITERATURA TRATA O ESPAÇO DE FORMA FRAGMENTADA","html":"<h2>A LITERATURA TRATA O ESPAÇO DE FORMA FRAGMENTADA</h2><div class=\"supportbox\">Política judiciária: infraestrutura física ausente dos núcleos temáticos principais.<br>Implementação: poucos estudos tratam o espaço como variável ativa.<br>Evidências empíricas: maior densidade sobre trabalho dos servidores.<br>Sociomaterialidade: ligação ainda escassa com espaços de serviços públicos.</div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."},{"t":"A PESQUISA DE PÓS-DOUTORADO","html":"<h2>A PESQUISA DE PÓS-DOUTORADO</h2><div class=\"supportbox\">Das arquiteturas judiciárias às arenas sociomateriais de implementação.<br><br>Origem: arquitetura judiciária e escala ARQJUD.<br>Desenvolvimento do framework ARENAS.<br>Ampliação pela governança regulatória.</div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."},{"t":"CINCO COMPONENTES FORMAM A ARENA","html":"<h2>CINCO COMPONENTES FORMAM A ARENA</h2><div class=\"supportbox\">Atores · Prescrições · Materialidades · Tecnologias · Práticas<br><br><b>Um componente isolado não forma uma arena. O objeto de análise é o entrelaçamento.</b></div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."},{"t":"CINCO MECANISMOS, COM EXEMPLOS DO JUDICIÁRIO","html":"<h2>CINCO MECANISMOS, COM EXEMPLOS DO JUDICIÁRIO</h2><div class=\"supportbox\">M1 Instrumentação · M2 Mediação do trabalho · M3 Mediação da experiência · M4 Legibilidade · M5 Aprendizagem</div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."},{"t":"ONDE ESTÁ O PROBLEMA?","html":"<h2>ONDE ESTÁ O PROBLEMA?</h2><div class=\"supportbox\">Fila · Balcão · Formulário · Sistema · Aplicativo · Equipe<br><br><b>A política ganha forma nesses lugares, objetos e relações.</b></div><div class=\"refs\">Slide de apoio para perguntas e aprofundamento.</div>","notes":"Slide de apoio."}];
let supportMode=false;
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
const slide=document.getElementById('slide'),notes=document.getElementById('notes');
function show(n){
 const max=supportMode?S.length:MAIN;
 i=Math.max(0,Math.min(max-1,n));
 slide.innerHTML=S[i].html + (i>=MAIN?'<div class="support-badge">SLIDE DE APOIO</div>':'');
 notes.textContent=S[i].notes||'';
 document.getElementById('count').textContent=(i+1)+' / '+max;
 document.getElementById('progress').style.width=((i+1)/max*100)+'%';
 history.replaceState(null,'','#'+(i+1));
}
function toggleSupport(){
 supportMode=!supportMode;
 document.getElementById('supportBtn').textContent=supportMode?'Ocultar apoio':'Slides de apoio';
 if(!supportMode && i>=MAIN)i=MAIN-1;
 show(i);
}
function toggleNotes(){document.body.classList.toggle('show-notes')}
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('supportBtn').onclick=toggleSupport;
document.getElementById('notesBtn').onclick=toggleNotes;
document.getElementById('fsBtn').onclick=toggleFs;
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs',!!document.fullscreenElement));
addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
 else if(e.key==='Home')show(0); else if(e.key==='End')show((supportMode?S.length:MAIN)-1);
 else if(e.key.toLowerCase()==='n')toggleNotes(); else if(e.key.toLowerCase()==='f')toggleFs();
});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(i+(d<0?1:-1));tx=null},{passive:true});
if(i>=MAIN){supportMode=true;document.getElementById('supportBtn').textContent='Ocultar apoio'}
show(i);
</script>
