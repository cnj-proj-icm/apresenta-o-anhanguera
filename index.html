<script>
const S=[{"img": "slide-01.jpg", "text": "O PAPEL DO ADMINISTRADOR NA IMPLEMENTAÇÃO DE POLÍTICAS PÚBLICAS · Igor Caires Machado · Analista Judiciário (CNJ) • Pós-doutorado (ENAP) · 07 de outubro de 2026  •  Curso de Administração  •  Brasília – DF · Da decisão pública à capacidade de entrega", "notes": "Abertura: Estamos aqui para falar de uma questão muito prática: o que acontece entre uma decisão e o resultado que chega ao cidadão? Não antecipar a estrutura da palestra.\n\nReferências e notas da versão original:\nBoa noite.\nPrimeiramente, obrigado à coordenação do curso de Administração pelo convite e obrigado a todos vocês por estarem aqui.\nEstamos aqui hoje para falar sobre uma questão muito prática, que é o papel do administrador na implementação das políticas públicas.\nOu seja, como uma decisão pública, que nasce numa norma, num programa, numa política, chega de fato à vida das pessoas?\nE é justamente nesse caminho, entre aquilo que foi decidido e aquilo que acontece na prática, que o trabalho do administrador ganha importância."}, {"img": "slide-02.jpg", "text": "O QUE É UMA POLÍTICA PÚBLICA? · Política pública é um conjunto articulado de decisões, diretrizes e ações voltadas ao enfrentamento de um problema público, sob responsabilidade ou coordenação do poder público. · Exemplo ilustrativo: ampliar o acesso à educação infantil · Secchi (2013/2014); Rua (2014); Tribunal de Contas da União (2020), Referencial de Controle de Políticas Públicas. · Problema público Famílias sem acesso a creches. · Resposta organizada Vagas, equipes e regras de acesso. · Resultado esperado Crianças com atendimento.", "notes": "Começar perguntando: que problema da vida de vocês depende de uma resposta coletiva? Apresentar a definição em linguagem simples.\n\nExemplo hipotético: famílias que precisam de vagas em creches. A política envolve a decisão de ampliar o acesso, os recursos, as unidades, as equipes e as regras. A lei ou o anúncio, isoladamente, não garantem o atendimento.\n\nTransição para a trajetória: guardem o exemplo da creche. A pergunta é como uma decisão vira atendimento de verdade. Foi a convivência com problemas desse tipo na gestão pública que me levou à pesquisa. Antes de voltar ao exemplo, conto rapidamente de onde vem esse olhar.\n\nNota conceitual: esta é uma síntese didática. O referencial do TCU também considera diretrizes, recursos públicos e a escolha de tratar ou não problemas públicos.\n\n[Sources]\nTCU. Política pública em dez passos, 2021. https://portal.tcu.gov.br/publicacoes-institucionais/cartilha-manual-ou-tutorial/politica-publica-em-dez-passos\nBusca oficial TCU: conjunto de intervenções e diretrizes governamentais dirigidas a problemas públicos. Entity keys web_ddeeaeb3, web_5ba784d5, web_9df4faba.\n[/Sources]"}, {"img": "slide-03.jpg", "text": "TRAJETÓRIA: PROJETO, GESTÃO E PESQUISA · Espaço Arquitetura e Urbanismo UFBA · Gestão TJBA, CNJ e ENAJU · Pesquisa Doutorado na UCES Pós-doutorado na ENAP · A pesquisa começou como uma forma de entender por que decisões nem sempre viram resultados na gestão.", "notes": "Até um minuto. Esta apresentação pessoal responde à pergunta: de onde vem meu interesse pela implementação?\n\nMinha trajetória começou com espaço, passou pela gestão e chegou à pesquisa. A formação em Arquitetura e Urbanismo, na UFBA, trouxe o olhar para os ambientes e seus usos. A atuação no TJBA, no CNJ e na ENAJU aproximou esse olhar dos problemas da gestão. O doutorado na UCES e o pós-doutorado na ENAP deram ferramentas para investigá-los.\n\nA pesquisa começou para mim como uma forma de entender por que decisões nem sempre viram resultados na gestão.\n\nTransição: voltemos à creche. Imagine que as vagas foram anunciadas, o sistema existe e a equipe recebeu treinamento. Mesmo assim, uma família não consegue concluir a matrícula. O que pode estar acontecendo?\n\nO exemplo da creche é hipotético e não corresponde a uma pesquisa pessoal relatada. Informações biográficas preservadas da apresentação original."}, {"img": "slide-04.jpg", "text": "DA POLÍTICA PÚBLICA À ORGANIZAÇÃO · Uma política pública organiza objetivos, instrumentos e responsabilidades para enfrentar um problema público. · NAS ORGANIZAÇÕES · Objetivo estratégico · › · projeto · › · equipe · › · recursos · › · execução · › · entrega · NAS POLÍTICAS PÚBLICAS · Problema público · › · política · › · organizações · › · equipes · › · implementação · › · resultado público · Objetivos precisam ser convertidos em ação organizada. · Pressman & Wildavsky (1973); Hill & Hupe (2022) Secchi; TCU, Referencial de Controle de Políticas Públicas (2020)", "notes": ""}, {"img": "slide-05.jpg", "text": "ONDE ENTRA O ADMINISTRADOR? · POLÍTICA PÚBLICA · ↓ · ADMINISTRADOR intermediação · ↓ · ORGANIZAÇÃO · ↓ · EQUIPES • PROCESSOS • RECURSOS • TECNOLOGIA • CONTRATOS • INFORMAÇÃO · ↓ · SERVIÇOS E RESULTADOS · formular · traduzir · coordenar · executar · monitorar · aprender · Intermediário: ator que conecta partes da implementação. · Lipsky (1980); Abbott, Levi-Faur & Snidal (2017); Hill & Hupe (2022) Intermediação como função exercida na implementação.", "notes": "Explicar o papel do administrador dentro da organização. A política define direção, mas a execução exige tradução organizacional: orçamento, equipes, contratos, sistemas, processos e informação. O administrador pode formular, traduzir, coordenar, executar, monitorar e aprender. Introduzir a ideia de intermediário com precisão: não é apenas alguém que está no meio, mas um ator que conecta partes da implementação por meio de funções concretas.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"}, {"img": "slide-06.jpg", "text": "O ADMINISTRADOR COMO INTERMEDIÁRIO · Na governança regulatória, o intermediário é definido pela função que exerce na relação. · GOVERNANÇA REGULATÓRIA · REGULADOR · → · INTERMEDIÁRIO · → · DESTINATÁRIO · ADMINISTRAÇÃO PÚBLICA · POLÍTICA PÚBLICA · → · ADMINISTRADOR · → · ORGANIZAÇÃO E CIDADÃO · A função é conectar objetivos, capacidades e ação organizada. · Funções intermediárias: traduzir • coordenar • informar • monitorar • construir capacidades · Evolução da pesquisa: arquitetura judiciária → implementação → governança regulatória → ARENAS · Abbott, Levi-Faur & Snidal (2017); Levi-Faur (2011); Hill & Hupe (2022)", "notes": ""}, {"img": "slide-07.jpg", "text": "DADOS COMO DIFERENCIAL DO ADMINISTRADOR · O diferencial hoje é transformar dados brutos em informação para decidir melhor. · INFORMAÇÕES\u000bBRUTAS\u000b\u000bplanilhas • sistemas\u000batendimentos • prazos · → · MÉTODO\u000bCIENTÍFICO + IA\u000b\u000bpergunta • hipótese\u000bvariável • análise · → · DECISÃO\u000bFUNDAMENTADA\u000b\u000bdiagnóstico • proposta\u000bindicador • aprendizagem · Organizações já produzem dados. Método transforma registros dispersos em evidência para ação. · Com método, a inteligência artificial acelera a análise.\u000bSem método, ela só acelera a confusão. · observar → medir → analisar → comunicar → decidir · Simon (1947);\u000bBriner et al. (2009)", "notes": ""}, {"img": "slide-08.jpg", "text": "ONDE A IMPLEMENTAÇÃO REALMENTE ACONTECE · A política chega à organização. Mas é em situações concretas que ela se realiza. · balcão · plataforma · formulário · sala · sistema · fila · equipe · contrato · documento · infraestrutura · atendimento · recursos · pessoas + regras + tecnologias + documentos + recursos + espaços · O que acontece quando esses elementos se encontram? · Lipsky (1980); Lascoumes & Le Galès (2007) Bitner (1992); Herd & Moynihan (2019)", "notes": "Transição: a política chega à organização, mas só se realiza em situações concretas. Pedir que os estudantes observem os elementos do slide: balcão, plataforma, formulário, sala, sistema, fila, equipe, contrato, documento, infraestrutura, atendimento. A implementação não acontece abstratamente dentro de um organograma. Ela acontece quando pessoas, regras, tecnologias, documentos, recursos e espaços se encontram e produzem práticas reais."}, {"img": "slide-09.jpg", "text": "PARA INVESTIGAR, É PRECISO DE TEORIA · Enxergar variáveis que o senso comum não vê · Formular boas perguntas · Interpretar as evidências · Foi assim que surgiu o Método ARENAS · Problema prático   ›   Teoria   ›   Pesquisa   ›   Método", "notes": "Transição: Então, se eu quero entender por que uma política está funcionando de um jeito e não de outro, eu preciso pesquisar. E aí a teoria começa a ter uma função muito prática: ela me ajuda a saber o que observar.\nQuem quiser conhecer toda a construção teórica, o projeto completo está disponível. Aqui eu quero mostrar o que esse trabalho permite fazer na prática. Origem do ARENAS na pesquisa de pós-doutorado do apresentador, com aprofundamento no apoio.\n\nReferências e notas da versão original:\n1 min 30 s.\nEu queria fazer uma observação sobre rigor, porque isso é importante tanto para a pesquisa quanto para a gestão.\n\nNem todo resultado tem o mesmo grau de maturidade.\n\nUma coisa pode ser uma proposição. Depois pode virar evidência preliminar. Depois um manuscrito, um trabalho aceito e, finalmente, uma publicação.\n\nDeclarar em que estágio está cada resultado é uma forma de proteger a credibilidade da pesquisa.\n\nHoje o ARENAS é uma formulação teórica fundamentada. O próximo passo é o teste empírico das proposições e a validação dos instrumentos.\n\nNa gestão vale a mesma disciplina: quando você apresenta um dado deixando claro o grau de certeza que ele permite, a qualidade da decisão melhora e a confiança também."}, {"img": "slide-10.jpg", "text": "CIDADÃO - BENEFÍCIO · Aplicativo, documento, fila, conversa com um servidor, decisão. Eu chamo esse conjunto de arena de implementação. · Arena = pessoas + regras + espaços + tecnologias + práticas · Sociomaterialidade nas organizações (Orlikowski, 2007) Imbricação entre humano e material (Leonardi, 2011) Como delimitar uma arena: política e ponto de contato · Quem participa? Que regras orientam? · Que espaços e artefatos existem? Que tecnologias são usadas? · O que as pessoas realmente fazem?", "notes": "Exemplo ilustrativo. Primeiro percorrer a experiência do cidadão. Só depois apresentar a definição curta. Uma arena pode atravessar prédios, plataformas e documentos. As cinco perguntas orientam sua delimitação. Referências: Orlikowski (2007), Leonardi (2011).\n\nReferências e notas da versão original:\n1 min 30 s.\nPara analisar uma arena, eu organizei cinco grupos de componentes.\n\nPrimeiro, os atores: profissionais, cidadãos, gestores, intermediários.\n\nDepois, as prescrições: normas, regras, procedimentos, critérios.\n\nTemos as materialidades: prédio, sala, balcão, mobiliário, documento.\n\nAs tecnologias: sistema, plataforma, formulário, sinalização.\n\nE, por fim, as práticas: esperar, circular, atender, decidir, adaptar.\n\nO importante é observar a relação entre essas coisas.\n\nPeguem uma norma de acessibilidade. Ela só ganha existência prática quando encontra uma rampa adequada, um sistema acessível, um servidor preparado e uma rotina de atendimento coerente.\n\nÉ esse entrelaçamento que constitui a arena."}, {"img": "slide-11.jpg", "text": "UM PROTOCOLO SIMPLES PARA INVESTIGAR A IMPLEMENTAÇÃO · A   Arranjo espacial · R   Rotinas de trabalho · E   Experiência · N   Navegabilidade · A   Aprendizagem · S   Sociomaterialidade · 1  Observar · 2  Diagnosticar · 3  Redesenhar · 4  Testar · 5  Avaliar · Protocolo em desenvolvimento Ciclo desdobrado em seis ações para esta aula As proposições e os instrumentos requerem teste empírico · 6  Aprender", "notes": "O ARENAS é uma formulação fundamentada, ainda em desenvolvimento e validação. Nesta aula, testar e avaliar aparecem separados para tornar o ciclo mais didático. Após mapear a arena: como a regra virou prática? Onde aparecem as fricções? Essas fricções chegam a quem pode corrigi-las? As seis lentes apoiam a investigação. Os mecanismos formais ficam no apoio.\n\nReferências e notas da versão original:\n3 min.\nVamos aplicar essa lógica a uma situação bem comum.\n\nImaginem um órgão que redesenhou o protocolo de atendimento. O novo fluxo foi criado, a meta foi definida, a equipe foi comunicada. Três meses depois, o tempo de atendimento praticamente não mudou.\n\nOnde vocês começariam a investigar?\n\n[Pausa. Ouvir algumas respostas.]\n\nUma possibilidade é olhar para o arranjo: a distribuição de pessoas e recursos realmente mudou?\n\nDepois, para as rotinas: o trabalho que acontece de verdade seguiu o fluxo que foi desenhado?\n\nTambém precisamos olhar para a experiência. A equipe e os usuários entenderam a mudança?\n\nE para a navegabilidade: o percurso ficou realmente mais claro?\n\nPor fim, aprendizagem: as falhas observadas voltaram para quem tem poder de decidir e corrigir?\n\nEssa é uma lógica de gestão baseada em evidências. Antes de alterar a regra de novo, investigue o que aconteceu na execução."}, {"img": "slide-12.jpg", "text": "O ÓRGÃO REDESENHOU O ATENDIMENTO. A FILA CONTINUA. · Caso ilustrativo: três meses após a mudança, a fila continua. Qual é a primeira hipótese de vocês? · Espaço A distribuição mudou? · Rotina real O trabalho mudou? · Sistema A tecnologia mudou? · Usuários Compreenderam? · Equipes Compreenderam? · Primeiro, hipóteses. Depois, evidências. Onde há fricção e quem pode corrigi-la? Briner, Denyer e Rousseau (2009) · Erros Há registro e retorno?", "notes": "Pausar e recolher hipóteses antes de apresentar respostas. O fluxo foi redesenhado, a meta foi definida e a equipe foi comunicada. Não assumir que o problema é falta de treinamento. Aplicar as seis perguntas. Pedir à turma uma fonte de dados para testar cada hipótese. Caso hipotético para exercício, não resultado empírico do ARENAS.\n\nReferências e notas da versão original:\n2 min.\nE aqui eu chego a uma ideia que considero central para a formação em Administração.\n\nPesquisa empírica é uma competência do administrador.\n\nPrimeiro porque ajuda a formular melhor o problema. Muitas vezes aquilo que aparece no cotidiano é apenas um sintoma.\n\nDepois, o método organiza a investigação. Ele impede que a gente fique apenas na impressão.\n\nA evidência ajuda a sustentar uma decisão. E a comunicação transforma esse conhecimento em algo que pode circular na organização e influenciar escolhas.\n\nSimon já dizia que administrar é decidir. E, para mim, uma das contribuições mais importantes da pesquisa é ensinar a separar opinião, hipótese e evidência.\n\nQuando a experiência profissional pode ser descrita, analisada e comunicada com método, ela ganha muito mais força."}, {"img": "slide-13.jpg", "text": "COMO TRANSFORMAR UM PROBLEMA DE GESTÃO EM PESQUISA? · Problema A fila continua. · Pergunta Onde o atendimento trava? · Hipótese Há retrabalho no cadastro. · Dados Tempos, retornos e observação. · Uma sequência de investigação, do sintoma à decisão fundamentada. · Exemplo ilustrativo derivado do caso da fila A hipótese ainda precisa de teste Briner, Denyer e Rousseau (2009) · Análise Comparar etapas e unidades. · Decisão Testar uma mudança e avaliar.", "notes": "Percorrer a sequência: problema, pergunta, hipótese, dados, análise e decisão. A hipótese de retrabalho é apenas uma explicação possível. Considerar hipóteses rivais, como demanda maior ou capacidade insuficiente. Definir dados e critérios antes de decidir. A pesquisa torna explícito o caminho entre o problema e a proposta de mudança.\n\nReferências e notas da versão original:\n2 min.\nEntão, como começar uma pesquisa sem esperar aparecer um grande projeto acadêmico?\n\nComece pelo seu próprio trabalho.\n\nObserve. Que problema se repete no seu estágio, na empresa ou no órgão onde você trabalha?\n\nDepois registre. Anote casos, fluxos, reclamações, improvisos. Coisas pequenas começam a revelar padrões quando são registradas.\n\nDepois tente medir. Quase toda organização produz uma quantidade enorme de dados administrativos que raramente é explorada de forma sistemática.\n\nE escreva. O que você descobriu pode virar um relatório, uma proposta de melhoria, um trabalho de conclusão ou um artigo.\n\nÉ por isso que eu defendo a pesquisa como parte da formação profissional. Ela melhora a capacidade de decidir e também diferencia quem consegue transformar experiência em conhecimento."}, {"img": "slide-14.jpg", "text": "EXEMPLO DE PERGUNTA DE PESQUISA · PERGUNTA A TESTAR Quando serviços simples migram para o digital, o atendimento presencial fica mais complexo? Como testar? Comparar antes e depois e comparar unidades. Medir o perfil dos atendimentos. Observar a demanda de espaço e de equipe. · Pergunta de pesquisa, não resultado confirmado Comparar condições e explicações alternativas Christensen et al. (2020), conforme apresentação original", "notes": "Tratar como pergunta e hipótese, não como achado. Antes/depois isoladamente não demonstra causalidade. Observar mudanças de demanda, equipe e perfil dos usuários. Comparar unidades e definir o que significa complexidade, como tempo, retorno ou necessidade de coordenação. Não há resultados empíricos apresentados neste exemplo.\n\nReferências e notas da versão original:\n2 min.\nPara levar esse framework para uma aplicação mais prática, eu desenvolvi o Método ARENAS.\n\nEle organiza o diagnóstico em seis lentes: arranjo espacial, rotinas de trabalho, experiência, navegabilidade, aprendizagem e sociomaterialidade.\n\nEssa última lente funciona quase como uma costura entre as demais, porque obriga a olhar para as relações entre pessoas, regras, tecnologias e espaço.\n\nO ciclo de aplicação é bastante direto: observar, diagnosticar, redesenhar, testar e avaliar, e aprender com o resultado.\n\nEu já desenvolvi um protótipo com vinte e quatro cartas e um checklist bilíngue para conduzir oficinas.\n\nAinda é um protótipo. Eu não testei esse instrumento em oficina até agora. E, inclusive, gostaria de fazer esse tipo de teste com estudantes, porque é uma forma muito boa de aproximar pesquisa e prática."}, {"img": "slide-15.jpg", "text": "UMA BOA PESQUISA SABE O QUE AINDA NÃO SABE · Hipótese Uma explicação a testar. · Evidência O que os dados permitem observar. · Conclusão O que a análise sustenta, com limites. · Nunca apresente uma hipótese como se fosse resultado. · ARENAS: formulação teórica fundamentada Teste empírico e validação dos instrumentos em desenvolvimento Distinguir proposta, evidência e conclusão", "notes": "Retomar a pergunta sobre digitalização. Ela é uma hipótese de investigação, não uma conclusão. A conclusão depende da qualidade da evidência e deve reconhecer os limites da comparação. Preservar a distinção entre proposição e validação empírica do ARENAS.\n\nReferências e notas da versão original:\n1 min 30 s.\nPara organizar o que vimos, eu deixaria quatro perguntas.\n\nComo essa política foi traduzida quando chegou à organização?\n\nQue arena concreta está fazendo essa política funcionar?\n\nQue evidências mostram o que está acontecendo de verdade?\n\nE como a organização aprende com a experiência e corrige o que precisa ser corrigido?\n\nEssas perguntas voltam ao ponto inicial da palestra.\n\nEntre uma decisão pública e a entrega ao cidadão existe um trabalho de organização. O administrador atua justamente aí. E a pesquisa empírica ajuda a tornar esse funcionamento visível, analisável e melhorável."}, {"img": "slide-16.jpg", "text": "SEU LOCAL DE TRABALHO É UM CAMPO DE PESQUISA · 1 Observe Que problema se repete? · 2 Registre Casos, fluxos e erros. · 3 Meça Use dados disponíveis. · 4 Teste Avalie uma mudança. · Empresa, hospital, escola, órgão público, tribunal, banco ou plataforma digital: todos podem ser campos de pesquisa. · Artigo, relatório, dashboard ou proposta de melhoria Pesquisa como competência profissional Dados e observação orientam decisões · 5 Comunique O resultado e seus limites.", "notes": "Comunique o resultado. O produto pode ser artigo, relatório, dashboard ou proposta de mudança. Usar apenas dados autorizados e respeitar a privacidade das pessoas. O contexto profissional oferece perguntas de pesquisa em organizações públicas e privadas.\n\nReferências e notas da versão original:\n1 min 30 s.\nE eu deixo aqui também um campo de pesquisa que, para quem estuda Administração, é muito rico: o sistema de Justiça.\n\nÀs vezes ele é visto apenas pelo lado jurídico. Mas o Judiciário também é uma grande organização pública e presta serviços.\n\nEntão aparecem problemas de governança, produtividade, acessibilidade, inteligência artificial, dados, educação, gestão de pessoas e experiência do usuário.\n\nHá bastante tempo a literatura já vem tratando o Judiciário como objeto de reforma e de política pública. E existe uma agenda consolidada sobre desempenho e administração da Justiça.\n\nPara quem gosta de gestão, há muita coisa concreta para investigar nesse campo."}, {"img": "slide-17.jpg", "text": "E DAQUI PARA ONDE? · A graduação pode ser o início de uma trajetória de investigação, e não o fim do estudo. · Graduação · › · curiosidade · › · iniciação científica · › · pesquisa · › · pós-graduação · › · produção de conhecimento · › · transformação · Que problemas da Administração ainda precisam ser compreendidos? · Que situações do seu trabalho podem virar perguntas de pesquisa? · Que conhecimento você pode produzir a partir da realidade que conhece? · Um problema recorrente pode virar projeto, análise de dados, relatório, artigo ou proposta de melhoria.", "notes": "Fechamento de abertura de horizonte. A graduação não precisa ser o ponto final do estudo. Muitos problemas de Administração que aparecem no trabalho cotidiano podem virar perguntas de pesquisa: filas, retrabalho, sistemas que não funcionam, processos que demoram, equipes que improvisam. A mensagem é incentivar iniciação científica, pesquisa aplicada, pós-graduação e produção de conhecimento a partir da realidade que os estudantes já conhecem.\n\n\n\n\n\n\n\n\n\n\n\n\n"}, {"img": "slide-18.jpg", "text": "CONTINUE PERGUNTANDO. · Continue estudando. Continue investigando. · Administração também é produção de conhecimento. · Igor Caires Machado  •  cairesmachado-svg.github.io/Site_hub · IV Congresso Científico · Anhanguera Asa Norte · 2026 · Materiais, referências e contato · Aponte a câmera para continuar a conversa — agora como pesquisa. · Obrigado.", "notes": "Encerramento. Retomar a ideia central: continuem perguntando, estudando e investigando. A Administração também é produção de conhecimento. Apontar para o QR code com materiais, referências e contato. Agradecer à Anhanguera Asa Norte e aos estudantes. Depois deste slide, há slides de apoio ocultos para perguntas e aprofundamento.\n\n\n\n\n\n\n\n\n\n\n\n"}];
const img=document.getElementById('slide'),cap=document.getElementById('cap'),notes=document.getElementById('notes');
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
S.forEach(s=>{const p=new Image();p.src=s.img});
function show(n){i=Math.max(0,Math.min(S.length-1,n));img.src=S[i].img;img.alt='Slide '+(i+1)+': '+S[i].text;cap.textContent=S[i].text;
notes.textContent=S[i].notes||'Sem notas para este slide.';document.getElementById('count').textContent=(i+1)+' / '+S.length;
document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';history.replaceState(null,'','#'+(i+1));}
function toggleNotes(){const on=document.body.classList.toggle('show-notes');document.getElementById('nbtn').setAttribute('aria-pressed',on)}
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs',!!document.fullscreenElement));
addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
 else if(e.key==='Home')show(0); else if(e.key==='End')show(S.length-1);
 else if(e.key.toLowerCase()==='n')toggleNotes(); else if(e.key.toLowerCase()==='f')toggleFs();});
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('nbtn').onclick=toggleNotes;document.getElementById('fbtn').onclick=toggleFs;
img.onclick=e=>{const r=img.getBoundingClientRect();show(i+(e.clientX-r.left<r.width/3?-1:1))};
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(i+(d<0?1:-1));tx=null});
show(i);
</script>
